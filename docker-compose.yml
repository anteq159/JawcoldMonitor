# JawcoldMonitor - jedyny plik potrzebny do uruchomienia:
#
#   docker compose up -d
#
# Obrazy backendu i frontendu są pobierane gotowe z GHCR (budowane przez
# GitHub Actions dla arm64 i amd64), więc instalacja na Raspberry trwa
# minuty, nie kilkanaście minut kompilacji. `build:` zostaje jako
# zapasowe źródło: bez dostępu do rejestru (lub z JAWCOLD_BUILD=local)
# `jawcold update` buduje obrazy lokalnie z tego repozytorium.
#
# Wersję wybiera JAWCOLD_VERSION w .env (domyślnie "latest").
name: jawcoldmonitor

# Docker's default json-file driver never rotates: on a Pi running for
# months the container logs grow without bound on the SD card (5 GB in
# three months on the first installation). 3 x 10 MB per container is
# plenty for troubleshooting; application events live in the database.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # PostgreSQL 16 + TimescaleDB (hypertable, kompresja i agregaty dla
    # tabeli odczytów - see backend/app/core/timescale.py). Same Postgres
    # major and Alpine base as the postgres:16-alpine image used before
    # 1.22, so an existing data volume is reused as-is.
    image: timescale/timescaledb:2.30.2-pg16
    restart: unless-stopped
    logging: *default-logging
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_DB: jawcold
      POSTGRES_USER: jawcold
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jawcold_dev_pass}
      # The image's first-start timescaledb-tune reads the container memory
      # limit as 0 under cgroup v2 on Raspberry Pi OS and panics, aborting
      # initdb - fresh installs never came up. Postgres defaults are fine
      # for this workload.
      NO_TS_TUNE: "true"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Over TCP: during first-start initdb the image runs a temporary
      # socket-only server, which a plain pg_isready reported as ready -
      # the backend then connected too early and failed.
      test: ["CMD-SHELL", "pg_isready -U jawcold -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/anteq159/jawcoldmonitor-backend:${JAWCOLD_VERSION:-latest}
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    # Every application setting comes from .env (see .env.example); only
    # the values derived from it are spelled out below.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://jawcold:${DB_PASSWORD:-jawcold_dev_pass}@postgres/jawcold
      JAWCOLD_DEPLOY: image
    volumes:
      # Floor maps and automatic backups survive image updates.
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
      # The host .env, so the panel can edit deploy-level values like
      # PANEL_PORT from Ustawienia (applied with `jawcold apply`).
      - ./.env:/app/host.env
      # The whole /dev instead of a fixed `devices:` entry: a USB adapter
      # that is re-plugged (or renumbered ttyACM0 -> ttyACM1) stays
      # reachable without recreating the container, a stable
      # /dev/serial/by-id/... path can be used in RS485_PORTS, and the
      # stack starts on machines with no adapter at all. Access is still
      # limited to USB serial character devices by the cgroup rules below.
      - /dev:/dev
    device_cgroup_rules:
      - "c 188:* rmw"   # ttyUSB* (FTDI, CH340, CP210x)
      - "c 166:* rmw"   # ttyACM* (CDC-ACM, e.g. WCH quad serial)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 600s   # first start on TimescaleDB converts existing history
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/anteq159/jawcoldmonitor-frontend:${JAWCOLD_VERSION:-latest}
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PANEL_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
