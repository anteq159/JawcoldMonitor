# Builds the backend and frontend images for arm64 (Raspberry Pi) and amd64
# and publishes them to GHCR, so installations pull ready images instead of
# compiling on the Pi (scripts/jawcold update, install.sh). Tags: latest,
# the version from backend/app/VERSION, and the commit sha.
name: Docker images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < backend/app/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/jawcoldmonitor-${{ matrix.component }}:latest
            ghcr.io/${{ github.repository_owner }}/jawcoldmonitor-${{ matrix.component }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/jawcoldmonitor-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
